[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-forensics"
version = "0.1.0"
authors = [
    { name = "Rohit Singh", email = "rohitsingh0166@users.noreply.github.com" }
]
description = "Auditing public municipal works fraud via 64-bit perceptual image forensics and bipartite cartel graph analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "networkx>=3.0"
]
keywords = [
    "forensics",
    "image-hashing",
    "cartel-detection",
    "bipartite-graph",
    "civic-tech",
    "fraud-detection",
    "mospi"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security"
]

[project.urls]
"Homepage" = "https://github.com/rohitsingh0166/civic-forensics"
"Bug Tracker" = "https://github.com/rohitsingh0166/civic-forensics/issues"

[tool.setuptools.packages.find]
where = ["src"]
